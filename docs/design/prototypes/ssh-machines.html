<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Superset · SSH 机器</title>
  <style>
    :root { --bg:#17181b; --side:#121316; --panel:#1c1d21; --raised:#24252b; --line:#ffffff0e; --text:#ededef; --muted:#9698a3; --dim:#626570; --green:#8bd9ae; --accent:#b9adff; --red:#ef9a9a; --radius:12px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; font-size:13px; color:var(--text); }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; background:#0d0e10; }
    button,input,select { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    button,a,input,select { -webkit-tap-highlight-color:transparent; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button { border:0; background:none; }
    h1,h2,h3,p { margin:0; }
    svg.icon { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .app { min-height:100vh; background:var(--bg); }
    .titlebar { height:44px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 18px; gap:16px; background:var(--side); }
    .traffic { display:flex; gap:8px; }
    .traffic i { width:11px; height:11px; border-radius:50%; background:#524448; }
    .traffic i:nth-child(2) { background:#57503e; }.traffic i:nth-child(3) { background:#3f5145; }
    .title-label { color:var(--dim); font-size:11px; letter-spacing:.3px; }
    .prototype { margin-left:auto; display:flex; align-items:center; gap:9px; color:var(--muted); font-size:11px; }
    .prototype span { border:1px solid #ffffff15; padding:3px 7px; border-radius:5px; color:#b0b2ba; }
    .prototype button { color:var(--dim); font-size:11px; }.prototype button:hover { color:var(--text); }
    .shell { display:grid; grid-template-columns:210px minmax(0,1fr); min-height:calc(100vh - 44px); }
    .sidebar { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:28px 14px 16px; gap:26px; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 12px; font-size:18px; font-weight:650; letter-spacing:-.7px; }
    .logo { width:25px; height:26px; color:var(--text); }
    .nav { display:flex; flex-direction:column; gap:5px; }
    .nav button { width:100%; display:flex; align-items:center; gap:11px; border-radius:7px; padding:11px 12px; color:var(--muted); text-align:left; }
    .nav button:hover { background:#ffffff04; color:var(--text); }
    .nav button.active { color:var(--text); background:#ffffff08; }
    .nav .count { margin-left:auto; font-size:11px; color:var(--muted); }
    .label { font-size:10px; font-weight:500; letter-spacing:1.3px; color:var(--dim); text-transform:uppercase; }
    .sidebar .label { padding:0 12px; margin-bottom:12px; }
    .project-nav button { display:flex; gap:10px; align-items:center; width:100%; padding:9px 12px; text-align:left; color:var(--muted); border-radius:7px; }
    .project-nav button:hover { background:#ffffff04; color:var(--text); }
    .project-dot { width:7px; height:7px; border-radius:2px; background:#a29ada; }.project-dot.blue { background:#7ba0cc; }
    .sidebar-bottom { margin-top:auto; display:grid; gap:16px; }
    .local-device { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); padding:18px 10px 2px; }
    .local-device svg { color:var(--dim); }.local-device strong { font-size:12px; font-weight:500; }.local-device small { display:block; color:var(--dim); margin-top:3px; font-size:10px; }
    .main { padding:36px 40px 24px; max-width:1600px; width:100%; margin:0 auto; }
    .breadcrumb { color:var(--dim); font-size:11px; margin-bottom:14px; display:flex; gap:9px; align-items:center; }.breadcrumb span:last-child { color:var(--muted); }
    .page-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    h1 { font-size:27px; font-weight:600; letter-spacing:-.8px; line-height:1.3; }
    .subtitle { color:var(--muted); line-height:1.8; font-size:12px; margin-top:9px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 13px; border-radius:7px; font-size:12px; white-space:nowrap; border:1px solid #ffffff13; background:#ffffff03; min-height:36px; }
    .btn:hover { background:#ffffff08; border-color:#ffffff23; }
    .btn.primary { background:#eae9ef; color:#222228; border-color:#eae9ef; font-weight:550; }.btn.primary:hover { background:white; }
    .btn.small { padding:7px 10px; min-height:30px; font-size:11px; }

    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:6px; color:var(--muted); }.icon-btn:hover { background:#ffffff09; color:var(--text); }

    .metric { display:flex; gap:9px; align-items:baseline; color:var(--muted); font-size:11px; }.metric b { font-size:21px; font-weight:500; letter-spacing:-.8px; color:var(--text); }.metric small { font-size:10px; color:var(--dim); }
    .metrics .divider { width:1px; height:22px; background:var(--line); }

    .filters button span { margin-left:6px; color:var(--dim); font-size:10px; }
    .search { display:flex; align-items:center; gap:7px; color:var(--dim); border:1px solid var(--line); border-radius:7px; padding:7px 9px; width:180px; }.search svg { width:14px; height:14px; }.search input { background:none; border:0; outline:none; min-width:0; width:100%; color:var(--text); font-size:11px; }.search:focus-within { border-color:#b9adff70; }.search input::placeholder { color:var(--dim); }
    .table-head { display:grid; grid-template-columns:1fr 103px 72px; padding:10px 17px; color:var(--dim); font-size:10px; letter-spacing:.4px; }
    .machine-list { display:grid; gap:9px; }

    .machine-row:hover { background:#ffffff03; border-color:#ffffff19; }.machine-row.selected { background:#b9adff07; border-color:#b9adff3a; }.machine-row.selected::before { content:""; position:absolute; left:-1px; width:3px; height:29px; background:var(--accent); border-radius:2px; }
    .machine-name { display:flex; align-items:center; gap:12px; min-width:0; }.device-icon { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid #ffffff0b; border-radius:10px; background:#ffffff03; color:#a5a6b1; flex-shrink:0; }.device-icon svg { width:22px; height:22px; }
    .machine-name>div:last-child { min-width:0; }.machine-name strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.detail h2,h1 { overflow-wrap:anywhere; }.project-nav button { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .machine-name strong { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }.machine-name code { font-size:10px; color:var(--dim); display:block; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .status { display:inline-flex; gap:6px; align-items:center; font-size:10px; white-space:nowrap; color:var(--muted); }.dot { width:5px; height:5px; border-radius:50%; background:#737680; flex-shrink:0; }.status.connected { color:var(--green); }.connected .dot { background:var(--green); box-shadow:0 0 8px #8bd9ae33; }.status.error { color:#d8b58a; }.error .dot { background:#d8b58a; }.status.connecting { color:var(--accent); }.connecting .dot { background:var(--accent); animation:pulse 1s infinite; }
    .machine-meta { margin-top:7px; font-size:10px; color:var(--dim); }.row-end { display:flex; align-items:center; justify-content:flex-end; gap:10px; color:var(--dim); font-size:11px; }.row-end svg { width:14px; }
    .local-row { display:flex; gap:12px; align-items:center; padding:16px 17px; border-top:1px solid var(--line); margin-top:27px; }.local-row .device-icon { width:32px; height:32px; background:none; }.local-row strong { font-size:11px; font-weight:500; color:var(--muted); }.local-row p { font-size:10px; color:var(--dim); margin-top:5px; }.local-row .btn { margin-left:auto; }
    .hint-card { display:flex; gap:12px; padding:17px; background:#ffffff02; border:1px solid var(--line); border-radius:9px; margin-top:23px; color:var(--dim); }.hint-card svg { width:17px; color:var(--muted); margin-top:2px; }.hint-card strong { display:block; font-size:11px; font-weight:500; color:var(--muted); margin-bottom:7px; }.hint-card p { font-size:11px; line-height:1.8; }
    .detail { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; align-self:start; }
    .detail-head { padding:23px 22px 20px; }.detail-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }.detail-top .device-icon { width:46px; height:46px; background:#ffffff04; color:#bab9c5; }.detail h2 { font-size:18px; letter-spacing:-.4px; font-weight:550; margin:17px 0 7px; }.detail .os { font-size:11px; color:var(--dim); }.detail-actions { display:flex; gap:8px; margin-top:21px; }.detail-actions .primary { flex:1; }
    .detail-tabs { display:flex; gap:22px; padding:0 22px; border-bottom:1px solid var(--line); }.detail-tabs button { padding:12px 0; font-size:11px; color:var(--muted); border-bottom:2px solid transparent; }.detail-tabs button.active { color:var(--text); border-bottom-color:var(--accent); }
    .detail-body { padding:21px 22px; }.section-line { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }.section-line .label { font-size:10px; letter-spacing:.5px; }.text-btn { font-size:11px; color:var(--accent); display:flex; gap:5px; align-items:center; }.text-btn:hover { color:#d2caff; }.text-btn svg { width:13px; height:13px; }
    .workspace-item { padding:13px 0; display:flex; align-items:center; gap:10px; width:100%; text-align:left; border-bottom:1px solid var(--line); }.workspace-item:last-child { border-bottom:0; }.workspace-item svg { width:17px; color:var(--dim); }.workspace-item .arrow { margin-left:auto; width:13px; }.workspace-item strong { font-size:12px; font-weight:500; }.workspace-item p { color:var(--dim); font-size:10px; margin-top:6px; }.workspace-item:hover strong { color:var(--accent); }
    .agent-summary { margin-top:18px; display:flex; gap:9px; padding:12px; background:#8bd9ae06; border:1px solid #8bd9ae15; border-radius:7px; color:var(--green); font-size:11px; line-height:1.8; }.agent-summary svg { width:14px; height:14px; margin-top:3px; }.agent-summary.stale { color:var(--muted); background:#ffffff02; border-color:var(--line); }
    .detail-footer { padding:15px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--dim); }
    .kv { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:11px; }.kv span { color:var(--muted); }.kv code { color:#cbccd3; font-size:10px; word-break:break-all; max-width:185px; text-align:right; }.danger-link { color:var(--red); font-size:11px; }.danger-link:disabled { color:var(--dim); }
    .danger-zone { margin-top:25px; padding-top:18px; border-top:1px solid var(--line); }.danger-zone p { font-size:10px; line-height:1.8; color:var(--dim); margin-top:9px; }
    .menu-anchor { position:relative; }.popover { position:absolute; right:0; top:35px; background:#2a2b30; border:1px solid #ffffff15; box-shadow:0 15px 30px #0005; padding:5px; border-radius:8px; min-width:170px; z-index:3; }.popover button { display:block; width:100%; text-align:left; padding:9px 10px; font-size:11px; border-radius:4px; }.popover button:hover { background:#ffffff08; }.popover .remove { color:var(--red); border-top:1px solid var(--line); margin-top:4px; }
    .empty { padding:55px 22px; text-align:center; color:var(--muted); border:1px dashed #ffffff12; border-radius:10px; font-size:12px; }.empty p { color:var(--dim); margin:10px 0 20px; font-size:11px; }
    .page-footer { margin-top:30px; display:flex; align-items:center; justify-content:space-between; color:var(--dim); font-size:10px; gap:12px; }.page-footer button { color:var(--muted); font-size:10px; display:flex; align-items:center; gap:6px; }.page-footer button svg { width:13px; height:13px; }
    dialog { color:var(--text); border:1px solid #ffffff15; background:#1c1d22; padding:0; border-radius:14px; box-shadow:0 24px 100px #0007; width:min(460px,calc(100vw - 32px)); max-height:calc(100vh - 40px); overflow:auto; }
    dialog::backdrop { background:#090a0d99; backdrop-filter:blur(3px); }
    dialog.drawer { width:440px; max-width:100vw; max-height:100vh; height:100vh; margin:0 0 0 auto; border-radius:0; border-top:0; border-right:0; border-bottom:0; }
    dialog.drawer[open] { display:flex; flex-direction:column; overflow:hidden; }
    .drawer form { display:flex; flex-direction:column; min-height:0; flex:1; }
    .drawer .dialog-head,.drawer .dialog-footer { flex-shrink:0; }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; padding:24px 26px 20px; border-bottom:1px solid var(--line); }.dialog-head h2 { font-size:17px; font-weight:550; letter-spacing:-.3px; }.dialog-head p { font-size:11px; color:var(--muted); margin-top:8px; }.dialog-content { padding:24px 26px; }.dialog-footer { display:flex; justify-content:flex-end; gap:9px; padding:18px 26px; border-top:1px solid var(--line); }.drawer .dialog-content { min-height:0; overflow:auto; flex:1; }
    .steps { display:flex; gap:10px; align-items:center; margin-bottom:28px; font-size:10px; color:var(--dim); }.steps .line { height:1px; background:var(--line); flex:1; }.steps b { display:inline-flex; justify-content:center; align-items:center; width:18px; height:18px; border-radius:50%; background:#ffffff06; font-size:9px; margin-right:5px; }.steps .current { color:var(--accent); }.steps .current b { background:#b9adff15; }
    .field { display:block; margin-bottom:20px; font-size:11px; color:#bfc0c9; }.field input,.field select { display:block; width:100%; margin-top:9px; background:#131418; border:1px solid #ffffff12; border-radius:7px; color:var(--text); padding:11px 12px; font-size:12px; min-height:39px; }.field input::placeholder { color:var(--dim); }.field input:focus,.field select:focus { outline:none; border-color:#b9adff80; }.field small { display:block; color:var(--dim); font-size:10px; line-height:1.8; margin-top:7px; }.field-row { display:grid; grid-template-columns:1fr 95px; gap:14px; }
    .segmented { display:flex; padding:3px; border:1px solid var(--line); background:#131418; border-radius:7px; margin-bottom:23px; }.segmented button { flex:1; color:var(--dim); font-size:11px; padding:8px; border-radius:5px; }.segmented button.active { background:#2a2b32; color:var(--text); }
    .test-result { margin-top:20px; padding:14px; background:#ffffff03; border:1px solid var(--line); border-radius:8px; font-size:11px; line-height:1.9; color:var(--muted); }.test-result strong { color:var(--text); font-weight:500; }.test-result.success { border-color:#8bd9ae30; background:#8bd9ae05; }.test-result.success strong { color:var(--green); }.test-result.error { border-color:#ef9a9a35; }.test-result.error strong { color:var(--red); }.test-result code { display:block; margin:7px 0 12px; font-size:9px; word-break:break-all; color:var(--dim); }.test-line { display:flex; gap:9px; align-items:center; }.test-line svg { width:14px; height:14px; color:var(--green); }.test-line.wait svg { color:var(--accent); }
    .dialog-copy { font-size:12px; line-height:1.9; color:var(--muted); }.dialog-copy strong { color:var(--text); font-weight:500; }.confirm-box { padding:15px; border:1px solid #ef9a9a23; background:#ef9a9a04; border-radius:8px; margin-top:20px; font-size:11px; line-height:1.8; color:var(--red); }.confirm-check { display:flex; align-items:flex-start; gap:9px; margin-top:20px; font-size:11px; line-height:1.8; color:var(--muted); }.confirm-check input { accent-color:var(--accent); margin-top:4px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(18px); padding:13px 19px; background:#30323a; border:1px solid #ffffff18; box-shadow:0 8px 35px #0005; border-radius:9px; font-size:12px; opacity:0; pointer-events:none; transition:.2s; display:flex; align-items:center; gap:9px; z-index:20; max-width:calc(100vw - 24px); }.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }.toast svg { color:var(--green); width:15px; height:15px; }
    .workspace-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; margin-top:25px; }.workspace-card { padding:22px; border:1px solid var(--line); border-radius:10px; background:var(--panel); text-align:left; }.workspace-card:hover { border-color:#b9adff40; }.workspace-card .project { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; margin-bottom:17px; }.workspace-card h3 { font-size:16px; font-weight:500; margin-bottom:9px; letter-spacing:-.3px; }.workspace-card code { font-size:10px; color:var(--dim); }.workspace-card .bottom { display:flex; align-items:center; justify-content:space-between; gap:14px; border-top:1px solid var(--line); padding-top:17px; margin-top:21px; font-size:10px; color:var(--muted); }
    .workspace-scope { display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); margin:29px 0 20px; }.workspace-scope select { color:var(--text); background:var(--panel); border:1px solid #ffffff16; border-radius:6px; padding:8px 32px 8px 12px; }
    .editor { border:1px solid var(--line); border-radius:11px; background:var(--panel); margin-top:25px; overflow:hidden; }.editor-tabs { display:flex; gap:22px; align-items:center; border-bottom:1px solid var(--line); padding:0 22px; font-size:11px; color:var(--dim); height:47px; }.editor-tabs .active { color:var(--text); }.editor-tabs .status { margin-left:auto; }.chat-demo { padding:35px; max-width:730px; margin:auto; }.user-message { padding:15px 19px; background:#ffffff05; border:1px solid var(--line); border-radius:9px; margin-left:50px; font-size:12px; line-height:1.9; }.agent-message { margin-top:30px; display:flex; gap:13px; font-size:12px; line-height:2; }.agent-logo { width:26px; height:26px; background:#b9adff12; color:var(--accent); border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }.agent-message .label { margin-bottom:10px; color:var(--muted); }.tool-call { margin-top:15px; padding:10px 13px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:10px; }.tool-call code { color:#bcbbce; }.terminal { border-top:1px solid var(--line); background:#141519; padding:20px 25px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; line-height:1.9; color:var(--muted); }.terminal .prompt { color:var(--green); }.terminal .line { color:var(--dim); }
    @keyframes pulse { 50% { opacity:.3; } }
    @media(min-width:1500px) { .main { padding-top:47px; }.machine-layout { gap:32px; grid-template-columns:minmax(0,1fr) 370px; }.machine-row { padding:23px 20px; } }

  <script>
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const seed = () => [
      {id:'mini', name:'Studio Mac mini', host:'mac-mini.example', user:'alex', port:22, os:'macOS 15.5', arch:'Apple M4 · arm64', status:'connected', backend:'running', latency:24, auth:'SSH 配置', alias:'mini-studio', identity:'~/.ssh/id_ed25519', synced:'刚刚', tasks:3, workspaces:[{id:'ssh-flow',name:'SSH 连接体验',project:'superset',branch:'feat/ssh-machines',tasks:2},{id:'landing',name:'首页更新',project:'personal-site',branch:'feat/new-home',tasks:1}]},
      {id:'linux', name:'Linux Build', host:'build.example', user:'dev', port:22, os:'Ubuntu 24.04', arch:'8 vCPU · x86_64', status:'disconnected', backend:'unknown', latency:38, auth:'SSH 密钥', identity:'~/.ssh/id_ed25519', synced:'12 分钟前', tasks:1, workspaces:[{id:'build',name:'构建优化',project:'superset',branch:'perf/build',tasks:1}]},
      {id:'lab', name:'Home Lab', host:'lab.example', user:'alex', port:2222, os:'Debian 12', arch:'4 vCPU · x86_64', status:'error', backend:'unknown', latency:0, auth:'SSH 密钥', identity:'~/.ssh/id_ed25519', synced:'昨天 18:42', tasks:0, workspaces:[]}
    ];
    let machines=seed(), selected='mini', page='machines', filter='all', query='', detailTab='workspaces', scope='all', projectFilter='', editor=null, menuOpen=false, connectionEpoch=0, testEpoch=0, formMode='host', verified=false, tested=false, editId=null, toastTimer;
    const main=document.getElementById('main'), modal=document.getElementById('modal'), drawer=document.getElementById('machine-dialog');
    const localWorkspaces=[], projects=['superset','personal-site'];
    const projectLocations = new Map([['superset',['mini','linux','local']],['personal-site',['mini','local']]]);
    const localMachine={id:'local',name:'这台 Mac',status:'connected',user:'alex',host:'localhost',alias:'local',workspaces:localWorkspaces};
    const getMachine = id => id==='local'?localMachine:machines.find(m=>m.id===id);
    const machine = () => getMachine(selected);
    const connected = m => m.status==='connected';
    const label = m => ({connected:'已连接',disconnected:'未连接',error:'无法连接',connecting:'连接中'})[m.status];
    const statusBadge = m => `<span class="status ${m.status}"><i class="dot"></i>${label(m)}</span>`;
    const activeCount = m => m.workspaces.reduce((n,w)=>n+w.tasks,0);
    const taskLabel = m => connected(m)?`${activeCount(m)} 个任务运行中`:`上次同步：${m.tasks} 个运行任务`;
    function toast(message) { clearTimeout(toastTimer); const el=document.getElementById('toast'); el.innerHTML=icon('check')+escapeHtml(message); el.classList.add('show'); toastTimer=setTimeout(()=>el.classList.remove('show'),4200); }
    function heading(title,subtitle,action) { return `<div class="breadcrumb"><span>个人空间</span><span>/</span><span>${escapeHtml(title)}</span></div><div class="page-heading"><div><h1>${escapeHtml(title)}</h1><p class="subtitle">${subtitle}</p></div>${action||''}</div>`; }
    function render() {
      document.getElementById('nav-count').textContent=machines.length;
      document.getElementById('nav-machines').classList.toggle('active',page==='machines');
      document.getElementById('nav-workspaces').classList.toggle('active',page!=='machines');
      document.getElementById('nav-machines').setAttribute('aria-current',page==='machines'?'page':'false');
      document.getElementById('nav-workspaces').setAttribute('aria-current',page!=='machines'?'page':'false');
      document.querySelector('.project-nav').innerHTML='<div class="label">项目</div>'+projects.map((p,i)=>`<button data-action="project" data-project="${escapeHtml(p)}"><span class="project-dot ${i%2?'blue':''}"></span>${escapeHtml(p)}</button>`).join('');
      if(page==='machines') renderMachines(); else if(page==='editor') renderEditor(); else renderWorkspaces();
    }
    function renderMachines() {
      const live=machines.filter(connected);
      main.innerHTML=heading('SSH 机器','把工作带到你的机器上。通过 SSH 直连，远端任务独立运行。',`<button class="btn primary" data-action="add">${icon('plus')}添加机器</button>`)+
        `<div class="metrics"><div class="metric"><b>${machines.length}</b>台远端机器</div><div class="divider"></div><div class="metric"><b>${live.length}</b>已连接</div><div class="divider"></div><div class="metric"><b>${live.reduce((n,m)=>n+activeCount(m),0)}</b>运行任务<small>已连接机器</small></div><div class="connection-note">${icon('shield')}SSH 直接连接</div></div>
        <div class="machine-layout"><section aria-label="机器列表"><div class="toolbar"><div class="filters" aria-label="连接状态筛选">${[['all','全部'],['connected','已连接'],['disconnected','未连接'],['error','异常']].map(([value,text])=>`<button data-action="filter" data-value="${value}" class="${filter===value?'active':''}" aria-pressed="${filter===value}">${text}<span>${machines.filter(m=>value==='all'||m.status===value).length}</span></button>`).join('')}</div><label class="search">${icon('search')}<input id="machine-search" aria-label="搜索机器" placeholder="搜索机器…" value="${escapeHtml(query)}"></label></div><div class="table-head"><span>机器</span><span>连接状态</span><span style="text-align:right">任务</span></div><div id="machine-list" class="machine-list"></div><div class="local-row"><div class="device-icon">${icon('laptop')}</div><div><strong>这台 Mac</strong><p>本地项目和会话始终可用</p></div><button class="btn small" data-action="local-workspaces">本地工作区${icon('arrow')}</button></div><div class="hint-card">${icon('clock')}<div><strong>你的任务，继续留在远端</strong><p>断开 SSH 或退出这台 Mac 上的 Superset，远端 agent 和终端会继续运行。重新连接后，可以接着工作。</p></div></div></section><aside id="detail" class="detail" aria-label="机器详情"></aside></div><div class="page-footer"><span>连接配置保存在本机 · 未连接机器显示上次同步信息</span><button data-action="simulate-close">${icon('laptop')}体验关闭应用后重新连接</button></div>`;
      renderRows(); renderDetail();
    }
    function renderRows() {
      const filtered=machines.filter(m=>(filter==='all'||m.status===filter)&&`${m.name} ${m.host} ${m.user}`.toLowerCase().includes(query.toLowerCase()));
      document.getElementById('machine-list').innerHTML=filtered.length?filtered.map(m=>`<button class="machine-row ${selected===m.id?'selected':''}" data-action="select" data-id="${m.id}" aria-pressed="${selected===m.id}"><div class="machine-name"><div class="device-icon">${icon(m.os.startsWith('macOS')?'mini':'server')}</div><div><strong>${escapeHtml(m.name)}</strong><code>${escapeHtml(m.user)}@${escapeHtml(m.host)}</code></div></div><div>${statusBadge(m)}<div class="machine-meta">${connected(m)?`${m.latency} ms · SSH`:m.synced+'同步'}</div></div><div class="row-end"><span class="task-number">${connected(m)?activeCount(m):'—'}</span>${icon('chevron')}</div></button>`).join(''):`<div class="empty">没有找到机器<p>换个关键词，或添加你的第一台远端机器。</p><button class="btn small" data-action="clear-search">清除筛选</button></div>`;
    }
    function renderDetail() {
      const m=machine(), el=document.getElementById('detail');
      if(!m) { el.innerHTML=`<div class="empty">选择一台机器<p>查看连接信息和远端工作区。</p><button class="btn small" data-action="add">${icon('plus')}添加机器</button></div>`; return; }
      const isLive=connected(m);
      el.innerHTML=`<div class="detail-head"><div class="detail-top"><div class="device-icon">${icon(m.os.startsWith('macOS')?'mini':'server')}</div><div style="display:flex;align-items:center;gap:7px">${statusBadge(m)}<div class="menu-anchor"><button class="icon-btn" aria-label="更多机器操作" aria-expanded="${menuOpen}" data-action="menu">${icon('dots')}</button>${menuOpen?`<div class="popover"><button data-action="edit">编辑连接配置</button><button data-action="diagnose">检查连接</button><button class="remove" data-action="remove">移除机器…</button></div>`:''}</div></div></div><h2>${escapeHtml(m.name)}</h2><p class="os">${escapeHtml(m.os)} · ${escapeHtml(m.arch)}</p><div class="detail-actions">${isLive?`<button class="btn primary" data-action="machine-workspaces">打开工作区${icon('arrow')}</button><button class="btn" data-action="disconnect">断开</button>`:`<button class="btn primary" data-action="connect" ${m.status==='connecting'?'disabled':''}>${icon('link')}${m.status==='connecting'?'正在连接…':'连接机器'}</button><button class="btn" data-action="edit">编辑</button>`}</div></div><div class="detail-tabs"><button data-action="detail-tab" data-value="workspaces" class="${detailTab==='workspaces'?'active':''}" aria-pressed="${detailTab==='workspaces'}">工作区 <span style="color:var(--dim);margin-left:4px">${m.workspaces.length}</span></button><button data-action="detail-tab" data-value="connection" class="${detailTab==='connection'?'active':''}" aria-pressed="${detailTab==='connection'}">连接信息</button></div><div class="detail-body">${detailTab==='workspaces'?`<div class="section-line"><span class="label">${isLive?'远端会话':'上次同步的会话'}</span><button class="text-btn" data-action="new-workspace" ${isLive?'':'disabled'}>${icon('plus')}新建</button></div>${m.workspaces.length?m.workspaces.map(w=>`<button class="workspace-item" data-action="open-workspace" data-id="${w.id}">${icon('branch')}<div><strong>${escapeHtml(w.name)}</strong><p>${escapeHtml(w.project)} · ${isLive?w.tasks+' 个任务':m.synced}</p></div>${icon('chevron').replace('class="icon"','class="icon arrow"')}</button>`).join(''):`<div style="padding:20px 0;color:var(--dim);font-size:11px;line-height:1.9">${isLive?'还没有工作区，创建一个远端会话开始工作。':'连接后可以查看和创建远端工作区。'}</div>`}<div class="agent-summary ${isLive?'':'stale'}">${icon(isLive?'spark':'clock')}<div>${isLive?`<strong style="font-weight:500">${taskLabel(m)}</strong><br><span style="color:var(--muted);font-size:10px">退出本机应用后，任务继续运行。</span>`:`${m.backend==='stopped'?'远端服务已停止':taskLabel(m)}<br><span style="color:var(--dim);font-size:10px">${m.backend==='stopped'?'连接时可明确启动远端服务。':'重新连接后确认当前任务状态。'}</span>`}</div></div>`:`<div class="kv"><span>主机</span><code>${escapeHtml(m.host)}</code></div><div class="kv"><span>用户 / 端口</span><code>${escapeHtml(m.user)} : ${m.port}</code></div><div class="kv"><span>认证方式</span><code>${escapeHtml(m.auth)}</code></div><div class="kv"><span>远端服务</span><code>${isLive?'运行中':m.backend==='stopped'?'已停止':'待连接确认'}</code></div><div class="kv"><span>主机指纹</span><code>SHA256:demo…7Qx<br>已信任 · 演示指纹</code></div><div class="danger-zone"><button class="danger-link" data-action="stop" ${isLive?'':'disabled'}>停止远端服务…</button><p>停止此机器的 agent 和终端任务。仅断开连接时请使用上方「断开」。</p></div>`}</div><div class="detail-footer"><span>${isLive?'最近同步：刚刚':'最后同步：'+escapeHtml(m.synced)}</span><span>${isLive?'SSH 隧道已加密':'状态待确认'}</span></div>`;
    }
    function renderWorkspaces() {
      const filteredMachines=[...machines,localMachine].filter(m=>scope==='all'||m.id===scope);
      const entries=filteredMachines.flatMap(m=>m.workspaces.filter(w=>!projectFilter||w.project===projectFilter).map(w=>({m,w})));
      main.innerHTML=heading(projectFilter||'工作区','在本机或 SSH 机器上创建会话，每个会话保留自己的任务和终端。',`<div style="display:flex;gap:8px"><button class="btn" data-action="new-project">${icon('folder')}添加项目</button><button class="btn primary" data-action="new-workspace">${icon('plus')}新建会话</button></div>`)+`<div class="workspace-scope">运行位置<select id="workspace-scope" aria-label="选择工作区所在机器"><option value="all" ${scope==='all'?'selected':''}>所有机器</option><option value="local" ${scope==='local'?'selected':''}>这台 Mac · 本地</option>${machines.map(m=>`<option value="${m.id}" ${scope===m.id?'selected':''}>${escapeHtml(m.name)} · ${label(m)}</option>`).join('')}</select><button class="text-btn" data-action="nav-machines">管理机器${icon('arrow')}</button>${projectFilter?'<button class="text-btn" data-action="clear-project">全部项目</button>':''}</div><div class="workspace-grid">${entries.length?entries.map(({m,w})=>`<button class="workspace-card" data-action="workspace-card" data-machine="${m.id}" data-id="${w.id}"><div class="project"><span class="project-dot ${w.project==='personal-site'?'blue':''}"></span>${escapeHtml(w.project)}</div><h3>${escapeHtml(w.name)}</h3><code>${escapeHtml(w.branch)}</code><div class="bottom"><span>${escapeHtml(m.name)}</span>${connected(m)?`<span class="status connected"><i class="dot"></i>${w.tasks} 个运行任务</span>`:`<span class="status"><i class="dot"></i>连接后查看</span>`}</div></button>`).join(''):`<div class="empty">${scope==='local'?'本地还没有会话':'这里还没有工作区'}<p>新建会话时，可以选择运行它的机器。</p><button class="btn small" data-action="new-workspace">${icon('plus')}新建会话</button></div>`}</div><div class="hint-card">${icon('link')}<div><strong>一个入口，选择运行位置</strong><p>项目和会话留在所选机器上。SSH 配置统一在「SSH 机器」页面管理。</p></div></div>`;
    }
    function renderEditor() {

    document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='machine-form')saveMachine(event.target);if(event.target.id==='workspace-form')createWorkspace(event.target);if(event.target.id==='project-form')createProject(event.target);});
    document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(page!=='machines'){page='machines';render();}document.getElementById('machine-search').focus();}if(event.key==='Escape'&&menuOpen){menuOpen=false;renderDetail();}});
    drawer.addEventListener('close',()=>{testEpoch++;drawer.querySelector('[name="password"]')&&(drawer.querySelector('[name="password"]').value='');});
    render();
  </script>
</body>
</html>
